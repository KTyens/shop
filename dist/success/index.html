<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Payment received | CRTLU Digital</title><meta name="description" content="Your payment was accepted. Order confirmation and next steps."><script>(function(){const apiBaseUrl = "/api";

      (() => {
        const base = apiBaseUrl || '/api';

        window.CRTLU_CONFIG = Object.freeze({
          apiBaseUrl: normalizedBase,
        });

            <div class="status" style="color:var(--green);font-weight:800;">Order #${o.order.id} confirmed</div>
            <p class="muted" style="color:var(--muted);margin:8px 0 0;font-size:14px;">Status: ${o.order.status} / Total: ${n(o.order.amount_total,o.order.currency)}</p>
            ${t?`<ul style="margin:10px 0 0;padding-left:18px;color:#c9d8df;font-size:14px;">${t}</ul>`:``}
          `;return}if(i<8){setTimeout(a,1800);return}e.innerHTML=`<div class="status" style="color:var(--green);font-weight:800;">Payment completed</div><p class="muted" style="color:var(--muted);margin:8px 0 0;font-size:14px;">Order details will appear once the webhook is received.</p>`}catch{e.innerHTML=`<div class="status" style="color:var(--green);font-weight:800;">Payment completed</div><p class="muted" style="color:var(--muted);margin:8px 0 0;font-size:14px;">Order lookup is temporarily unavailable. Your payment was successful.</p>`}}a();</script></body></html>
